<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Waldemar Mazurek - Łowca Uczennic</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  html,body { width:100%; height:100%; overflow:hidden; background:#000; font-family:'Courier New',monospace; }
  canvas { display:block; image-rendering:pixelated; background:#2a1a0a; }

  #menu {
    position:fixed; inset:0; background:linear-gradient(180deg,#1a0a2a,#3a1040 50%,#5a1a30);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:#fff; text-align:center; padding:20px; z-index:999;
  }
  #menu h1 { font-size:clamp(20px,6vw,44px); color:#ffd700; text-shadow:3px 3px 0 #a00,6px 6px 0 #000; margin-bottom:6px; }
  #menu h2 { font-size:clamp(12px,3vw,20px); color:#ff88cc; text-shadow:2px 2px 0 #000; margin-bottom:16px; }
  #menu p { font-size:clamp(10px,2.6vw,14px); color:#ccc; max-width:600px; margin-bottom:10px; line-height:1.5; }
  .btn {
    padding:14px 32px; margin:6px; font-size:clamp(14px,3.5vw,20px); font-family:inherit; font-weight:bold;
    background:#ffd700; color:#000; border:4px solid #000; border-radius:10px; cursor:pointer;
    box-shadow:0 6px 0 #a00, 0 6px 12px rgba(0,0,0,.5);
  }
  .btn:active { transform:translateY(4px); box-shadow:0 2px 0 #a00; }
  .btn.sec { background:#ff88cc; box-shadow:0 6px 0 #800; }

  #hud {
    position:fixed; top:0; left:0; right:0; padding:6px 8px;
    display:none; justify-content:space-between; gap:4px;
    color:#fff; font-weight:bold; font-size:clamp(9px,2.4vw,14px);
    text-shadow:2px 2px 0 #000; z-index:10; pointer-events:none;
  }
  #hud div { background:rgba(0,0,0,.6); padding:3px 8px; border-radius:6px; border:2px solid #ffd700; white-space:nowrap; }

  #dpad { position:fixed; inset:0; pointer-events:none; z-index:20; display:none; }
  .dbtn {
    position:absolute; width:56px; height:56px; background:rgba(255,215,0,.85); border:3px solid #000;
    border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:24px; color:#000;
    font-weight:bold; pointer-events:auto; touch-action:none;
  }
  .dbtn:active { background:rgba(255,136,204,.95); }
  #btn-up    { left:calc(50% - 28px); bottom:180px; }
  #btn-down  { left:calc(50% - 28px); bottom:60px; }
  #btn-left  { left:calc(50% - 100px); bottom:120px; }
  #btn-right { left:calc(50% + 44px); bottom:120px; }

  #overlay {
    position:fixed; inset:0; background:rgba(0,0,0,.9); display:none;
    flex-direction:column; align-items:center; justify-content:center;
    color:#fff; text-align:center; padding:20px; z-index:500;
  }
  #overlay.show { display:flex; }
  #overlay h2 { font-size:clamp(18px,5vw,34px); color:#ffd700; text-shadow:3px 3px 0 #a00; margin-bottom:14px; }
  #overlay p { font-size:clamp(11px,2.8vw,16px); margin-bottom:10px; max-width:600px; }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud">
  <div>LVL: <span id="hud-lvl">1</span>/69</div>
  <div>Pietro: <span id="hud-floor">Parter</span></div>
  <div>Zlapane: <span id="hud-score">0</span>/<span id="hud-target">1</span></div>
  <div>Czas: <span id="hud-time">30</span></div>
</div>

<div id="dpad">
  <div class="dbtn" id="btn-up">&#9650;</div>
  <div class="dbtn" id="btn-down">&#9660;</div>
  <div class="dbtn" id="btn-left">&#9664;</div>
  <div class="dbtn" id="btn-right">&#9654;</div>
</div>

<div id="menu">
  <h1>WALDEMAR MAZUREK</h1>
  <h2>Lowca Uczennic</h2>
  <p>Zespol Szkol nr 2 im. M. Sklodowskiej-Curie<br>
  Lap uczennice ukrywajace sie w klasach!<br>
  69 poziomow. Im wyzej, tym szybciej uciekaja!</p>
  <p>Sterowanie: strzalki / WASD na PC, przyciski na telefonie.</p>
  <button type="button" class="btn" id="btn-start">GRAJ</button>
  <button type="button" class="btn sec" id="btn-mute">DZWIEK: WL</button>
</div>

<div id="overlay">
  <h2 id="ov-title">Poziom ukonczony!</h2>
  <p id="ov-text"></p>
  <button type="button" class="btn" id="ov-btn">DALEJ</button>
</div>

<script>
(function () {
  'use strict';

  // ---------- CANVAS ----------
  var VW = 480, VH = 240;
  var cv = document.getElementById('game');
  var ctx = cv.getContext('2d');
  cv.width = VW;
  cv.height = VH;

  function resize() {
    var w = window.innerWidth, h = window.innerHeight;
    var ratio = VW / VH;
    var dw = w, dh = w / ratio;
    if (dh > h) { dh = h; dw = h * ratio; }
    cv.style.width = dw + 'px';
    cv.style.height = dh + 'px';
    cv.style.position = 'absolute';
    cv.style.left = ((w - dw) / 2) + 'px';
    cv.style.top = ((h - dh) / 2) + 'px';
  }
  resize();
  window.addEventListener('resize', resize);

  // ---------- MAPY ----------
  var TILE = 12;
  var MAPS = [
    { name: 'Parter', grid: [
      "########################################",
      "#......................................#",
      "#.S....S....S....S....S....S....S......#",
      "#.###.###..###..###..###..###..###.###.#",
      "#.#17.#16.#.#15.#13.#12.#10.#9..#8.#.##",
      "#.#...#...#.#...#...#...#...#...#...#..#",
      "#.#...#...#.#...#...#...#...#...#...#..#",
      "#.###.###.#.###.###.###.###.###..####.#",
      "#......................................#",
      "#........###########...................#",
      "#........#sekret.#..#...................#",
      "#........#.......#..#....########.......#",
      "#........###.#####..#....#szatnia#......#",
      "#..........#.#......#....#.......#......#",
      "#..........#.#......#....#.......#......#",
      "#..........#.#......#....#.......#......#",
      "#..........###......#....#########......#",
      "#...................#...................#",
      "#......................................#",
      "########################################"
    ]},
    { name: 'Pietro 1', grid: [
      "########################################",
      "#......................................#",
      "#.S....S....S....S....S....S....S......#",
      "#.###.###..###..###..###..###..###.###.#",
      "#.#117#115#.#114#107#109#112#106#.#101#",
      "#.#....#...#.#...#...#...#...#...#.....#",
      "#.#....#...#.#...#...#...#...#...#.....#",
      "#.###.###.#.###.###.###.###.###..#####.#",
      "#......................................#",
      "#......................................#",
      "#........##########....................#",
      "#........#psycholog#...................#",
      "#........#.........#...................#",
      "#........####.#####....................#",
      "#......................................#",
      "#......................................#",
      "#......................................#",
      "#......................................#",
      "#......................................#",
      "########################################"
    ]},
    { name: 'Pietro 2', grid: [
      "########################################",
      "#......................................#",
      "#.S....S....S....S....S....S....S......#",
      "#.###.###..###..###..###..###..###.###.#",
      "#.#207#206#.#205#201#202#203#204#.#.##",
      "#.#....#...#.#...#...#...#...#...#..#..",
      "#.#....#...#.#...#...#...#...#...#..#..",
      "#.###.###.#.###.###.###.###.###..#####.#",
      "#......................................#",
      "#......................................#",
      "#......................................#",
      "#......................................#",
      "#......................................#",
      "#......................................#",
      "#......................................#",
      "#......................................#",
      "#......................................#",
      "#......................................#",
      "#......................................#",
      "########################################"
    ]}
  ];

  var MAP_W = MAPS[0].grid[0].length;
  var MAP_H = MAPS[0].grid.length;
  var OX = Math.floor((VW - MAP_W * TILE) / 2);
  var OY = Math.floor((VH - MAP_H * TILE) / 2);
  var currentMapIdx = 0;

  function getMap() { return MAPS[currentMapIdx].grid; }

  function tileAt(px, py) {
    var tx = Math.floor((px - OX) / TILE);
    var ty = Math.floor((py - OY) / TILE);
    if (tx < 0 || ty < 0 || tx >= MAP_W || ty >= MAP_H) return '#';
    return getMap()[ty][tx];
  }
  function walkable(px, py) {
    var t = tileAt(px, py);
    return t !== '#';
  }

  function randomFreeSpot() {
    var m = getMap();
    var free = [];
    for (var y = 1; y < MAP_H - 1; y++) {
      for (var x = 1; x < MAP_W - 1; x++) {
        if (m[y][x] === '.') free.push({ x: x, y: y });
      }
    }
    if (free.length === 0) return { px: OX + TILE * 2, py: OY + TILE * 2 };
    var t = free[Math.floor(Math.random() * free.length)];
    return { px: OX + t.x * TILE + TILE / 2, py: OY + t.y * TILE + TILE / 2 };
  }

  // ---------- AUDIO ----------
  var actx = null, muted = false, musicTimer = null, musicStep = 0;

  function ensureAudio() {
    try {
      if (!actx) {
        var Ctx = window.AudioContext || window.webkitAudioContext;
        if (Ctx) actx = new Ctx();
      }
      if (actx && actx.state === 'suspended') actx.resume();
    } catch (e) { console.warn('Audio nie dziala:', e); }
  }

  function beep(freq, dur, type, vol) {
    if (!actx || muted) return;
    try {
      var o = actx.createOscillator();
      var g = actx.createGain();
      o.type = type || 'square';
      o.frequency.value = freq;
      g.gain.setValueAtTime(vol || 0.1, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + dur);
    } catch (e) {}
  }

  var SFX = {
    catch: function() { beep(880, 0.08); setTimeout(function(){beep(1200,0.1);},70); },
    step:  function() { beep(70, 0.04, 'square', 0.04); },
    win:   function() { [523,659,784,1047].forEach(function(f,i){ setTimeout(function(){beep(f,0.15,'triangle',0.18);}, i*100); }); },
    lose:  function() { [400,300,200,100].forEach(function(f,i){ setTimeout(function(){beep(f,0.2,'sawtooth',0.18);}, i*120); }); },
    click: function() { beep(600, 0.05, 'square', 0.15); },
    start: function() { [523,659,784].forEach(function(f,i){ setTimeout(function(){beep(f,0.12,'triangle',0.18);}, i*80); }); }
  };

  var melody = [330,0,392,0,440,0,392,0, 330,0,294,0,262,0,294,0,
                330,0,392,0,440,0,523,0, 494,0,440,0,392,0,330,0];
  var bassNotes = [131,0,131,0,165,0,165,0, 175,0,175,0,131,0,131,0];

  function startMusic() {
    if (musicTimer) return;
    musicStep = 0;
    musicTimer = setInterval(function() {
      if (muted || !actx) { musicStep++; return; }
      var m = melody[musicStep % melody.length];
      var b = bassNotes[musicStep % bassNotes.length];
      if (m) beep(m, 0.12, 'square', 0.04);
      if (b) beep(b, 0.18, 'triangle', 0.06);
      musicStep++;
    }, 180);
  }

  // ---------- STAN GRY ----------
  var G = {
    running: false,
    level: 1,
    score: 0,
    target: 1,
    timeLeft: 30,
    timeMax: 30,
    player: null,
    girls: [],
    particles: [],
    spawnTimer: 0,
    stepTimer: 0,
    bob: 0
  };

  function createPlayer() {
    return { x: OX + TILE * 2.5, y: OY + TILE * 2.5, dir: 1 };
  }
  function createGirl() {
    var s = randomFreeSpot();
    return {
      x: s.px, y: s.py, dir: 1,
      speed: 0.5 + G.level * 0.03,
      bob: 0, walkT: 0, wvx: 0, wvy: 0
    };
  }

  function moveEntity(e, dx, dy) {
    var r = 4;
    if (dx) {
      var nx = e.x + dx;
      if (walkable(nx + r, e.y) && walkable(nx - r, e.y)) e.x = nx;
    }
    if (dy) {
      var ny = e.y + dy;
      if (walkable(e.x, ny + r) && walkable(e.x, ny - r)) e.y = ny;
    }
  }

  // ---------- INPUT ----------
  var input = { up:false, down:false, left:false, right:false };

  window.addEventListener('keydown', function(e) {
    var k = e.key.toLowerCase();
    if (k === 'arrowup' || k === 'w') input.up = true;
    if (k === 'arrowdown' || k === 's') input.down = true;
    if (k === 'arrowleft' || k === 'a') input.left = true;
    if (k === 'arrowright' || k === 'd') input.right = true;
    if (k.indexOf('arrow') === 0 || k === ' ') e.preventDefault();
  });
  window.addEventListener('keyup', function(e) {
    var k = e.key.toLowerCase();
    if (k === 'arrowup' || k === 'w') input.up = false;
    if (k === 'arrowdown' || k === 's') input.down = false;
    if (k === 'arrowleft' || k === 'a') input.left = false;
    if (k === 'arrowright' || k === 'd') input.right = false;
  });

  function bindBtn(id, key) {
    var el = document.getElementById(id);
    if (!el) return;
    var on = function(e) { e.preventDefault(); input[key] = true; };
    var off = function(e) { e.preventDefault(); input[key] = false; };
    el.addEventListener('touchstart', on, { passive: false });
    el.addEventListener('touchend', off, { passive: false });
    el.addEventListener('touchcancel', off, { passive: false });
    el.addEventListener('mousedown', on);
    el.addEventListener('mouseup', off);
    el.addEventListener('mouseleave', off);
  }
  bindBtn('btn-up', 'up');
  bindBtn('btn-down', 'down');
  bindBtn('btn-left', 'left');
  bindBtn('btn-right', 'right');

  // ---------- UPDATE ----------
  function update(dt) {
    if (!G.running) return;
    var p = G.player;
    var pSpeed = 65;

    var dx = 0, dy = 0;
    if (input.left)  { dx -= 1; p.dir = -1; }
    if (input.right) { dx += 1; p.dir = 1; }
    if (input.up)    dy -= 1;
    if (input.down)  dy += 1;
    if (dx && dy) { dx *= 0.7071; dy *= 0.7071; }

    moveEntity(p, dx * pSpeed * dt, dy * pSpeed * dt);

    if (dx || dy) {
      G.bob += dt * 12;
      G.stepTimer -= dt;
      if (G.stepTimer <= 0) { SFX.step(); G.stepTimer = 0.22; }
    } else {
      G.bob = 0;
    }

    for (var i = G.girls.length - 1; i >= 0; i--) {
      var g = G.girls[i];
      g.bob += dt * 10;

      var ddx = g.x - p.x, ddy = g.y - p.y;
      var dist = Math.sqrt(ddx * ddx + ddy * ddy);

      if (dist < 55 && dist > 0.01) {
        moveEntity(g, (ddx / dist) * g.speed * 55 * dt, (ddy / dist) * g.speed * 55 * dt);
        g.dir = ddx > 0 ? 1 : -1;
      } else {
        g.walkT -= dt;
        if (g.walkT <= 0) {
          g.walkT = 0.5 + Math.random() * 1.5;
          var a = Math.random() * Math.PI * 2;
          g.wvx = Math.cos(a);
          g.wvy = Math.sin(a);
        }
        moveEntity(g, g.wvx * g.speed * 25 * dt, g.wvy * g.speed * 25 * dt);
      }

      if (dist < 9) {
        G.score++;
        SFX.catch();
        spawnParticles(g.x, g.y);
        G.girls.splice(i, 1);
        updateHUD();
        if (G.score >= G.target) { levelComplete(); return; }
      }
    }

    G.spawnTimer -= dt;
    if (G.spawnTimer <= 0 && G.girls.length < G.target - G.score) {
      G.girls.push(createGirl());
      G.spawnTimer = 0.5;
    }

    for (var j = G.particles.length - 1; j >= 0; j--) {
      var pa = G.particles[j];
      pa.x += pa.vx * dt;
      pa.y += pa.vy * dt;
      pa.vy += 60 * dt;
      pa.life -= dt;
      if (pa.life <= 0) G.particles.splice(j, 1);
    }

    G.timeLeft -= dt;
    if (G.timeLeft <= 0) { G.timeLeft = 0; gameOver(); return; }
    updateHUD();
  }

  function spawnParticles(x, y) {
    for (var i = 0; i < 12; i++) {
      var a = Math.random() * Math.PI * 2;
      G.particles.push({
        x: x, y: y,
        vx: Math.cos(a) * 40,
        vy: Math.sin(a) * 40 - 20,
        life: 0.6,
        color: ['#ffd700','#ff88cc','#fff'][i % 3]
      });
    }
  }

  // ---------- DRAW ----------
  function drawMap() {
    var m = getMap();
    for (var y = 0; y < MAP_H; y++) {
      for (var x = 0; x < MAP_W; x++) {
        var px = OX + x * TILE;
        var py = OY + y * TILE;
        var t = m[y][x];
        if (t === '#') {
          ctx.fillStyle = '#4a2a10';
          ctx.fillRect(px, py, TILE, TILE);
          ctx.fillStyle = '#6a3a1a';
          ctx.fillRect(px, py, TILE, 2);
        } else if (t === 'S') {
          ctx.fillStyle = '#ffcc00';
          ctx.fillRect(px, py, TILE, TILE);
          ctx.fillStyle = '#aa8800';
          ctx.fillRect(px + 2, py + 2, TILE - 4, TILE - 4);
          ctx.fillStyle = '#000';
          ctx.fillRect(px + 3, py + 4, TILE - 6, 1);
          ctx.fillRect(px + 3, py + 7, TILE - 6, 1);
        } else {
          ctx.fillStyle = ((x + y) % 2 === 0) ? '#d4b483' : '#c8a878';
          ctx.fillRect(px, py, TILE, TILE);
        }
      }
    }
  }

  function drawTeacher(x, y, dir, bob) {
    x = Math.round(x); y = Math.round(y);
    var oy = Math.round(Math.sin(bob) * 1);
    ctx.save();
    ctx.translate(x, y);

    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(-5, 6, 10, 2);
    ctx.scale(dir, 1);

    // nogi
    ctx.fillStyle = '#1a1a4a';
    ctx.fillRect(-4, 3, 3, 5);
    ctx.fillRect(1, 3, 3, 5);
    ctx.fillStyle = '#000';
    ctx.fillRect(-4, 7, 3, 1);
    ctx.fillRect(1, 7, 3, 1);

    // marynarka granatowa
    ctx.fillStyle = '#1e2a4a';
    ctx.fillRect(-4, -4, 8, 8);
    ctx.fillStyle = '#2a3a5a';
    ctx.fillRect(-4, -4, 8, 1);
    ctx.fillRect(-4, 0, 8, 1);
    ctx.fillRect(-2, -4, 1, 8);
    ctx.fillRect(2, -4, 1, 8);

    // koszula
    ctx.fillStyle = '#e8e8f0';
    ctx.fillRect(-2, -4, 4, 8);
    ctx.fillStyle = '#888';
    ctx.fillRect(-1, -2, 1, 1);
    ctx.fillRect(-1, 1, 1, 1);

    // rece
    ctx.fillStyle = '#1e2a4a';
    ctx.fillRect(-6, -3 + oy, 2, 6);
    ctx.fillRect(4, -3 - oy, 2, 6);
    ctx.fillStyle = '#e8b088';
    ctx.fillRect(-6, 3 + oy, 2, 2);
    ctx.fillRect(4, 3 - oy, 2, 2);

    // glowa
    ctx.fillStyle = '#e8b088';
    ctx.fillRect(-3, -11, 6, 7);
    // wlosy
    ctx.fillStyle = '#6a4a2a';
    ctx.fillRect(-3, -12, 6, 3);
    ctx.fillRect(-4, -11, 1, 2);
    ctx.fillRect(3, -11, 1, 2);
    // oczy
    ctx.fillStyle = '#fff';
    ctx.fillRect(-2, -8, 1, 1);
    ctx.fillRect(1, -8, 1, 1);
    ctx.fillStyle = '#000';
    ctx.fillRect(-2, -8, 1, 1);
    ctx.fillRect(1, -8, 1, 1);
    // brwi
    ctx.fillStyle = '#4a3018';
    ctx.fillRect(-3, -9, 2, 1);
    ctx.fillRect(1, -9, 2, 1);
    // zarost
    ctx.fillStyle = 'rgba(80,50,30,0.5)';
    ctx.fillRect(-2, -5, 4, 2);
    ctx.fillStyle = '#a06040';
    ctx.fillRect(-1, -5, 2, 1);

    ctx.restore();
  }

  function drawGirl(x, y, dir, bob) {
    x = Math.round(x); y = Math.round(y);
    var oy = Math.round(Math.sin(bob) * 1);
    ctx.save();
    ctx.translate(x, y);

    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(-4, 6, 8, 2);
    ctx.scale(dir, 1);

    // nogi
    ctx.fillStyle = '#f0c090';
    ctx.fillRect(-3, 3, 2, 4);
    ctx.fillRect(1, 3, 2, 4);
    ctx.fillStyle = '#ff88cc';
    ctx.fillRect(-3, 7, 2, 1);
    ctx.fillRect(1, 7, 2, 1);

    // sukienka
    ctx.fillStyle = '#ff5599';
    ctx.fillRect(-4, -4, 8, 8);
    ctx.fillStyle = '#ff88cc';
    ctx.fillRect(-4, -4, 8, 2);

    // rece
    ctx.fillStyle = '#f0c090';
    ctx.fillRect(-6, -3 + oy, 2, 5);
    ctx.fillRect(4, -3 - oy, 2, 5);

    // glowa
    ctx.fillStyle = '#f0c090';
    ctx.fillRect(-3, -11, 6, 7);

    // wlosy
    ctx.fillStyle = '#ffcc33';
    ctx.fillRect(-4, -12, 8, 4);
    ctx.fillRect(-4, -11, 1, 9);
    ctx.fillRect(3, -11, 1, 9);

    // oczy
    ctx.fillStyle = '#000';
    ctx.fillRect(-2, -8, 1, 2);
    ctx.fillRect(1, -8, 1, 2);

    // usta
    ctx.fillStyle = '#a00';
    ctx.fillRect(-1, -5, 2, 1);

    // rumience
    ctx.fillStyle = 'rgba(255,150,150,0.7)';
    ctx.fillRect(-3, -6, 1, 1);
    ctx.fillRect(2, -6, 1, 1);

    ctx.restore();
